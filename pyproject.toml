[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "akemi"
version = "0.1.0"
description = "Agente de IA autônomo para desktop Windows (estilo Jarvis)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Astronyz" }]
dependencies = [
    "numpy>=1.26,<3",
    "structlog>=24.4.0",
    "python-dotenv>=1.0.1",
    "pydantic-settings>=2.4.0",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
audio = [
    "PyAudioWPatch==0.2.12.7",
    "webrtcvad-wheels>=2.0.14",
]
stt = [
    "faster-whisper==1.0.3",
    "ctranslate2==4.4.0",
]
vision = [
    "mss==9.0.1",
    "Pillow==10.4.0",
    "pytesseract==0.3.13",
]
brain = [
    "anthropic==0.34.0",
    "openai==1.51.0",
    "ollama==0.3.3",
]
llamacpp = [
    "llama-cpp-python==0.3.1",
]
tts = [
    "piper-tts==1.2.0",
]
net = [
    "fastapi==0.115.0",
    "uvicorn==0.30.6",
    "httpx==0.27.2",
]
data = [
    "sqlite-utils==3.37",
]
self-improve = [
    "GitPython==3.1.43",
    "PyGithub==2.4.0",
]
windows = [
    "pywin32==306",
]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "webrtcvad-wheels>=2.0.14",
]

[project.scripts]
akemi-debug = "akemi.debug:main"

[tool.setuptools.packages.find]
include = ["akemi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"
